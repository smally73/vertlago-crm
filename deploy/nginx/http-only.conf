# Config de démarrage (avant le premier certificat Let's Encrypt) : pas de
# TLS, sert juste l'app en HTTP le temps que le DNS soit vérifié et que
# certbot obtienne un certificat. Remplacée par ssl.conf ensuite.

server {
    listen 80;
    server_name admin.vertlago.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
