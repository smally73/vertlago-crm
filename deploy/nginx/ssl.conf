# Config finale (après obtention du certificat Let's Encrypt) : redirige
# tout le HTTP vers HTTPS, termine le TLS, route /api vers le backend et
# le reste vers le frontend.

server {
    listen 80;
    server_name admin.vertlago.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.vertlago.com;

    ssl_certificate /etc/letsencrypt/live/admin.vertlago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vertlago.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
