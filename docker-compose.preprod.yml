version: "3.8"
services:
  db-preprod:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertlago
      POSTGRES_PASSWORD: vertlago
      POSTGRES_DB: vertlago_crm_preprod
    ports:
      - "5433:5432"
    volumes:
      - vertlago_db_preprod_data:/var/lib/postgresql/data

volumes:
  vertlago_db_preprod_data:
