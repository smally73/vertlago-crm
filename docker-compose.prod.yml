name: vertlago-crm-prod
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertlago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vertlago_crm}
    volumes:
      - vertlago_prod_db_data:/var/lib/postgresql/data
    # Pas de port publié : accessible uniquement depuis le réseau Docker interne.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - db
    # Pas de port publié : joignable uniquement via Nginx (reverse proxy).

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    # Pas de port publié : joignable uniquement via Nginx (reverse proxy).

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/http-only.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >-
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done;"

volumes:
  vertlago_prod_db_data:
  certbot_webroot:
  certbot_certs:
