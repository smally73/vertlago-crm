version: "3.8"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertlago
      POSTGRES_PASSWORD: vertlago
      POSTGRES_DB: vertlago_crm
    ports:
      - "5432:5432"
    volumes:
      - vertlago_db_data:/var/lib/postgresql/data

volumes:
  vertlago_db_data:
